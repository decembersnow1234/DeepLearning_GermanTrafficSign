{% extends "base.html" %}
{% block content %}

<!-- Bouton de retour -->
<div class="retour-page-bagues">
    <a href="{% url 'liste_bagues' %}" class="btn-retour">← Retour à la page des bagues</a>
</div>


<div class="produit-detail-container">
    <!-- Image principale -->
    <div class="image-principale-container">
        <img id="image-principale" src="{{ produit.images.first.image.url }}" alt="{{ produit.nom }}" class="image-arrondie">
    </div>

    <!-- Miniatures des images en dessous -->
    <div class="miniatures-container">
        <img class="miniature image-arrondie" src="{{ produit.images.first.image.url }}" alt="{{ produit.nom }}" data-image-url="{{ produit.images.first.image.url }}">
        {% for image in produit.images.all|slice:"1:" %}
        <img class="miniature image-arrondie" src="{{ image.image.url }}" alt="{{ produit.nom }}" data-image-url="{{ image.image.url }}">
        {% endfor %}
    </div>

    <!-- Informations du produit -->
    <div class="produit-info-container">
        <h1>{{ produit.nom }}</h1>
        <p>{{ produit.description }}</p>
        <p class="produit-prix"><b>Prix</b> : {{ produit.prix }} €</p>
    
      
        <!-- Formulaire d'ajout au panier -->
        <form method="POST">
            {% csrf_token %}
            <!-- Gestion de la quantité -->
            <div class="quantity-selector">
                <label for="quantity">Quantité :</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1">
            </div>
            <br>
            <button type="submit" class="btn btn-primary">Ajouter au panier 🛒</button>
        </form>
    </div>
</div>
{% endblock %}
